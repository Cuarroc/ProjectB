# Merge automatisch über die Queue, wenn CI grün und das Review der ANDEREN Modellfamilie ok ist (AGENTS.md Regel 4 und 5).
# „stopp“ ist die Notbremse. Squash: ein Commit pro PR.
shared:
  ci: &ci
    - check-success=test (ubuntu-latest)
    - check-success=test (windows-latest)
    - check-success=secrets
  # Am ursprünglichen PR geprüft, auch bei „@mergifyio queue“ (queue_conditions).
  freigabe: &freigabe
    - base=main
    - -draft
    - -label=stopp
    - and: *ci
    # Geschrieben von Claude -> Codex prüft; geschrieben von Codex -> ein frischer Claude-Agent prüft.
    - or:
        - and:
            - label=autor-claude
            - check-success=review-codex
        - and:
            - label=autor-codex
            - check-success=review/claude
        - and:
            - author=dependabot[bot]
            - check-success=review/claude
    # Oberfläche: Ein Claude-Agent hat den Screenshot geprüft.
    - or:
        - -files~=^src/
        - check-success=review/claude
    # CI-, Agenten- und Mergify-Dateien nur mit Elias' Ja. Nach dem Bot-Konto: label=elias-ok -> approved-reviews-by=Cuarroc.
    - or:
        - -files~=^(\.github/|\.mergify\.yml$|\.mcp\.json$|\.claude/|\.agents/)
        - label=elias-ok

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions: *freigabe
    # Am Entwurfs-PR der Queue geprüft: dort gibt es nur die CI, keine Review-Checks.
    merge_conditions:
      - -label=stopp
      - and: *ci

pull_request_rules:
  - name: grün und geprüft, ab in die Queue
    conditions: *freigabe
    actions:
      queue:
        name: default
