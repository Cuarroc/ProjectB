# Merge automatisch über die Queue, wenn CI grün und das Review der ANDEREN Modellfamilie ok ist (AGENTS.md Regel 4 und 5).
# „stopp“ ist die Notbremse. Squash: ein Commit pro PR.
shared:
  ci: &ci
    - check-success=test (ubuntu-latest)
    - check-success=test (windows-latest)
    - check-success=secrets

queue_rules:
  - name: default
    merge_method: squash
    # Geprüft am Entwurfs-PR der Queue: dort gibt es nur die CI, keine Review-Checks.
    merge_conditions:
      - -label=stopp
      - and: *ci

pull_request_rules:
  - name: grün und geprüft, ab in die Queue
    # Geprüft am ursprünglichen PR.
    conditions:
      - base=main
      - -draft
      - -label=stopp
      - and: *ci
      # Geschrieben von Claude -> Codex prüft; geschrieben von Codex -> ein frischer Claude-Agent prüft.
      - or:
          - and:
              - label=autor-claude
              - check-success=review-codex
          - and:
              - label=autor-codex
              - check-success=review/claude
      # Oberfläche: Ein Claude-Agent hat den Screenshot geprüft.
      - or:
          - -files~=^src/
          - check-success=review/claude
      # CI- und Mergify-Dateien nur mit Elias' Ja. Nach dem Bot-Konto: label=elias-ok -> approved-reviews-by=Cuarroc.
      - or:
          - -files~=^(\.github/|\.mergify\.yml$)
          - label=elias-ok
    actions:
      queue:
        name: default
