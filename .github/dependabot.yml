version: 2
updates:
  - package-ecosystem: cargo
    directory: /kern
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-updates:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
