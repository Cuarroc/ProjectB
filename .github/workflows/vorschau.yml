# Startbare Windows-App zum Ausprobieren (Elias, 06.11.2026). Kein Gate: ein roter Lauf blockiert keinen Merge.
# Läuft nur bei PRs mit dem Label „vorschau“, einmal am Tag auf main und von Hand, damit die Queue nicht wartet.
name: vorschau
on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vorschau-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'vorschau')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      # Ohne Installer: eine einzelne exe, WebView2 ist in Windows 11 enthalten.
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ProjectB-vorschau-${{ github.event.pull_request.number || 'main' }}
          path: src-tauri/target/release/projectb.exe
          if-no-files-found: error
          retention-days: 7
