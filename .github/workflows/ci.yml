name: ci
on:
  pull_request:
    # Ohne „edited“: Mergify schreibt jedes Prüfergebnis in seinen Queue-Entwurf. Jede Bearbeitung startete
    # die CI neu, die Queue kam nie zum Merge (06.11.2026). Neue Zeile „Tests weniger:“ im PR-Text: Lauf neu starten.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  # Abgebrochene oder verdrängte Läufe werfen den PR aus der Queue. Deshalb bekommt jeder Queue-Lauf eine eigene Gruppe.
  group: ci-${{ startsWith(github.head_ref, 'mergify/') && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 4

jobs:
  # Welche schweren Jobs der PR braucht. Übersprungen wird nur, was sicher nichts damit zu tun hat;
  # im Zweifel (Fehler, unbekannte Datei, Push auf main) läuft alles. Die Jobs selbst laufen immer,
  # nur ihre Schritte entfallen: so bleiben die Pflicht-Checks mit ihrem Namen grün.
  aenderungen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kern: ${{ steps.f.outputs.kern }}
      oberflaeche: ${{ steps.f.outputs.oberflaeche }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dateien=""
          [ -n "$PR" ] && dateien=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || dateien=""
          # nur MUSTER: true, wenn jede geänderte Datei auf MUSTER passt (leere Liste: false).
          nur() { [ -n "$dateien" ] && ! printf '%s\n' "$dateien" | grep -qvE "$1"; }
          kern=true; oberflaeche=true
          nur '^(src|src-tauri|public)/|\.md$|^(package(-lock)?\.json|index\.html|vite\.config\.[jt]s|tsconfig[^/]*\.json)$' && kern=false
          nur '\.md$' && oberflaeche=false # src-tauri hängt an kern/, deshalb nur bei reiner Doku
          echo "kern=$kern oberflaeche=$oberflaeche"
          echo "kern=$kern" >> "$GITHUB_OUTPUT"
          echo "oberflaeche=$oberflaeche" >> "$GITHUB_OUTPUT"

  oberflaeche:
    needs: aenderungen
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.aenderungen.outputs.oberflaeche == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.aenderungen.outputs.oberflaeche == 'true'
        with:
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.aenderungen.outputs.oberflaeche == 'true'
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
        if: needs.aenderungen.outputs.oberflaeche == 'true'
      - run: npm run build
        if: needs.aenderungen.outputs.oberflaeche == 'true'
      - run: npm test
        if: needs.aenderungen.outputs.oberflaeche == 'true'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: needs.aenderungen.outputs.oberflaeche == 'true'
        working-directory: src-tauri

  test:
    needs: aenderungen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.aenderungen.outputs.kern == 'true'
        with:
          workspaces: kern -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path kern/Cargo.toml --check
        if: needs.aenderungen.outputs.kern == 'true'
      - run: cargo clippy --locked --manifest-path kern/Cargo.toml --all-targets -- -D warnings
        if: needs.aenderungen.outputs.kern == 'true'
      - name: Tests ausführen
        if: needs.aenderungen.outputs.kern == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --manifest-path kern/Cargo.toml 2>&1 | tee testausgabe.txt
      - name: Testzahl erfassen
        if: needs.aenderungen.outputs.kern == 'true'
        shell: pwsh
        run: ./\.github\scripts\testzahl.ps1 -Mode count -Log testausgabe.txt -Output testzahl.json -Platform '${{ matrix.os }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.aenderungen.outputs.kern == 'true'
        with:
          name: testzahl-${{ matrix.os }}
          path: testzahl.json
          if-no-files-found: error

  testzahl:
    name: Testzahl-Wächter
    needs: [aenderungen, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Testzahlen laden und vergleichen
        if: needs.aenderungen.outputs.kern == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name testzahl-ubuntu-latest --dir current/ubuntu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name testzahl-windows-latest --dir current/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:EVENT_NAME -eq 'pull_request') {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($runs.Count -eq 0) { throw 'Kein grüner main-Lauf für den Vergleich gefunden' }
            if ($runs.Count -gt 0) {
              $runId = $runs[0].databaseId
              $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $names = @($artifacts.artifacts | Where-Object { -not $_.expired } | ForEach-Object { $_.name })
              $hasUbuntu = $names -contains 'testzahl-ubuntu-latest'
              $hasWindows = $names -contains 'testzahl-windows-latest'
              if ($hasUbuntu -ne $hasWindows) { throw 'Unvollständige Testzahlen auf main' }
              if ($hasUbuntu) {
                gh run download $runId --repo $env:GITHUB_REPOSITORY --name testzahl-ubuntu-latest --dir baseline/ubuntu
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                gh run download $runId --repo $env:GITHUB_REPOSITORY --name testzahl-windows-latest --dir baseline/windows
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              } else {
                # Vor dem ersten Lauf mit Artefakten: vorhandene cargo-Ausgabe von main nutzen.
                $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/jobs" | ConvertFrom-Json
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                foreach ($platform in @('ubuntu', 'windows')) {
                  $job = @($jobs.jobs | Where-Object { $_.name -eq "test ($platform-latest)" -and $_.conclusion -eq 'success' })
                  if ($job.Count -ne 1) { throw "Kein eindeutiger main-Testlauf für $platform" }
                  New-Item -ItemType Directory -Force "baseline/$platform" | Out-Null
                  gh api --allow-escape-sequences "repos/$env:GITHUB_REPOSITORY/actions/jobs/$($job[0].id)/logs" | Set-Content "baseline/$platform/log.txt"
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  ./\.github\scripts\testzahl.ps1 -Mode count -Log "baseline/$platform/log.txt" -Output "baseline/$platform/testzahl.json" -Platform "main $platform"
                }
              }
            }
          }
          ./\.github\scripts\testzahl.ps1 -Mode compare -Current current -Baseline baseline

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --offline .github/workflows

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fertiges Binary statt Docker-Action: spart den Image-Download. Gleiche Prüfung wie die Action (check, --all-features).
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny
      - run: cargo deny --manifest-path kern/Cargo.toml --all-features --log-level warn check
